<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grimm Gravity — グリム重力脱出</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Shippori+Mincho:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <div id="ui">
    <div id="hud">
      <span id="stageName"></span>
      <span id="moveCount">moves: 0</span>
      <span id="coinCount">🪙 0</span>
      <button id="titleBtn">🏠 タイトル</button>
      <button id="exitTestBtn" class="hidden">🛠️ エディットに戻る</button>
    </div>
    <div id="gravityIndicator">
      <div id="gravArrow">↓</div>
      <div id="gravLabel">重力</div>
    </div>
    <div id="touchControls">
      <div id="dpad">
        <button class="dpad-btn dpad-up"   data-dir="UP">↑</button>
        <button class="dpad-btn dpad-left" data-dir="LEFT">←</button>
        <button class="dpad-btn dpad-right" data-dir="RIGHT">→</button>
        <button class="dpad-btn dpad-down" data-dir="DOWN">↓</button>
        <div class="dpad-center">重力</div>
      </div>
      <div id="actionBtns">
        <button id="undoBtn" class="action-btn">↩️<span>戻る</span></button>
        <button id="resetBtn" class="action-btn">🔄<span>リセット</span></button>
      </div>
    </div>
  </div>

  <!-- ── ステージエディタUI ── -->
  <button id="editPanelToggleBtn" class="hidden">☰</button>
  <div id="editPanel" class="hidden">
    <div class="edit-panel-box">
      <div class="edit-panel-title">🛠️ ステージエディタ</div>
      
      <div class="panel-section">
        <div class="panel-title">1. タイルを配置</div>
        <div class="palette-grid" id="palette"></div>
      </div>

      <div class="panel-section">
        <div class="panel-title">2. ステージのサイズ</div>
        <div class="size-inputs">
          <div>
            <label>横幅 (列)</label>
            <input type="number" id="inputCols" min="5" max="30" value="12">
          </div>
          <div>
            <label>縦幅 (行)</label>
            <input type="number" id="inputRows" min="5" max="20" value="9">
          </div>
        </div>
      </div>

      <div class="panel-section">
        <div class="panel-title">3. テーマ</div>
        <select id="selectTheme">
          <option value="0">Ch.1 赤ずきん (森)</option>
          <option value="1">Ch.2 ラプンツェル (塔)</option>
          <option value="2">Ch.3 菓子の家 (菓子)</option>
          <option value="3">Ch.4 シンデレラ (牢獄)</option>
          <option value="4">Ch.5 雪の女王 (宮殿)</option>
        </select>
      </div>

      <div class="panel-section">
        <div class="panel-title">4. 保存 & 共有</div>
        <button id="exportBtn" class="action-btn">コードをコピー</button>
        <div class="import-area">
          <label>コード読み込み</label>
          <textarea id="importCode" rows="2" placeholder="コードをここに貼り付け"></textarea>
          <button id="importBtn" class="action-btn import-btn">適用する</button>
        </div>
      </div>

      <div class="panel-section">
        <div class="panel-title">5. マイステージ</div>
        <div class="my-stage-save-row">
          <input type="text" id="myStageName" maxlength="20" placeholder="ステージ名">
          <button id="saveMyStageBtn" class="action-btn">💾 保存</button>
        </div>
        <div id="myStagesList"></div>
      </div>
      
      <div class="panel-section action-section">
        <button id="testPlayBtn" class="action-btn mode-btn">⚔️ テストプレイ</button>
        <button id="editorCloseBtn" class="action-btn close-btn">🏠 タイトルへ</button>
      </div>
    </div>
  </div>

  <div id="overlay" class="hidden">
    <div id="overlayBox">
      <div id="overlayTitle"></div>
      <div id="overlayText"></div>
      <button id="overlayBtn"></button>
      <button id="overlayShopBtn" class="hidden">🛍️ スキンショップ</button>
      <button id="overlayTitleBtn" class="hidden">🏠 タイトルへ戻る</button>
    </div>
  </div>
  <div id="shopScreen" class="hidden">
    <div id="shopBox">
      <div id="shopHeader">
        <div id="shopTitle">🛍️ スキンショップ</div>
        <div id="shopCoins">🪙 0</div>
      </div>
      <div id="shopGrid"></div>
      <button id="shopCloseBtn">閉じる</button>
    </div>
  </div>
  <div id="codexScreen" class="hidden">
    <div id="codexBox">
      <div id="codexHeader">
        <div id="codexTitle">📜 称号図鑑</div>
        <div id="codexProgress">獲得済み: 0 / 0</div>
      </div>
      <div id="codexReward"></div>
      <div id="codexGrid"></div>
      <button id="codexCloseBtn">閉じる</button>
    </div>
  </div>
  <div id="storyScreen" class="hidden">
    <div id="storyBgGlow"></div>
    <div id="storyStageLeft" class="story-char hidden">
      <div class="story-char-icon"></div>
    </div>
    <div id="storyStageRight" class="story-char hidden">
      <div class="story-char-icon"></div>
    </div>
    <div id="storyBox">
      <div id="storyNameTag" class="hidden"></div>
      <div id="storyText"></div>
      <div id="storyNextHint">クリックして進む ▶</div>
    </div>
    <button id="storySkipBtn">スキップ ✕</button>
  </div>
  <div id="titleScreen">
    <div id="titleVignette"></div>
    <div id="titleContent">
      <div id="parchmentPanel">
        <div class="parchment-corner corner-tl"></div>
        <div class="parchment-corner corner-tr"></div>
        <div class="parchment-corner corner-bl"></div>
        <div class="parchment-corner corner-br"></div>

        <div id="titleLogo">
          <div class="logo-ornament">❦</div>
          <div class="logo-line">GRIMM GRAVITY</div>
          <div class="logo-line-jp">グリム重力脱出譚</div>
          <div class="logo-ornament logo-ornament-bottom">❦</div>
        </div>
        <div id="titleStory">
          魔女の呪いで物語の世界に閉じ込められた。<br>
          重力を操り、出口を目指せ。
        </div>
        <div class="title-main-btns" style="display: flex; justify-content: center; gap: 16px; margin-bottom: 30px;">
          <button id="startBtn" style="margin-bottom: 0;"><span class="btn-quill">🖋️</span>冒険を始める</button>
          <button id="editorBtn" style="margin-bottom: 0;"><span class="btn-quill">🛠️</span>ステージを作る</button>
        </div>
        <div id="continuePanel" class="hidden">
          <div id="continueLabel">✦ ステージを選ぶ ✦</div>
          <div id="stageSelectGrid"></div>
        </div>
        <div id="subButtonRow">
          <button id="shopBtn">🛍️ スキンショップ</button>
          <button id="codexBtn">📜 称号図鑑</button>
        </div>
        <div id="controls">
          <div class="ctrl-row"><kbd>←</kbd><kbd>↑</kbd><kbd>→</kbd><kbd>↓</kbd> または <kbd>A</kbd><kbd>W</kbd><kbd>D</kbd><kbd>S</kbd> — 重力の向きを変える</div>
          <div class="ctrl-row"><kbd>Z</kbd> — 1手だけ前に戻る &nbsp; <kbd>R</kbd> — ステージを最初からやり直す</div>
          <div class="ctrl-row touch-hint">📱 スマホでは画面の十字ボタンかスワイプで操作できます</div>
        </div>
      </div>
    </div>
    <div id="titleParticles"></div>
  </div>
  <!--
    読み込み順序（依存関係）:
      1. levels.js   — T, DIRS, STAGES を定義（他の全ファイルが参照）
      2. story.js    — CHARACTERS, シナリオ定義（logic.js が参照）
      3. renderer.js — canvas / ctx / render 系を定義（logic.js が呼び出す）
      4. logic.js    — state / gameLoop など。levels & renderer & story に依存
      5. editor.js   — ステージエディタのロジック
  -->
  <script src="levels.js"></script>
  <script src="story.js"></script>
  <script src="renderer.js"></script>
  <script src="logic.js"></script>
  <script src="editor.js"></script>
</body>
</html>
